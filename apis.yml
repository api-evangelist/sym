name: Sym
description: >-
  Sym was a developer-first authorization and access-management platform for
  platform, security, and infrastructure engineering teams. Rather than a REST
  API, Sym exposes its control plane as infrastructure-as-code: teams declare
  access flows, environments, targets, and user-facing fields with the Sym
  Terraform provider, customize runtime behavior with the Python SDK (hooks and
  reducers in impl.py), and operate the platform with the symflow CLI. It
  automated context-based, time-bound access requests and approvals across AWS
  (IAM, SSO), Okta, GCP, Jira, Slack, and other targets with centralized
  governance embedded in an organization's existing SDLC. The Sym product is now
  largely wound down — the docs root is sunset and most source repositories under
  github.com/symopsio are archived — but its published packages, Terraform
  provider, and changelog remain available.
