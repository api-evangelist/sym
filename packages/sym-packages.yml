notes: >-
  Sym has no public REST/OpenAPI surface. Its programmatic interface is the
  Terraform provider (declaring flows, environments, targets), the Python SDK
  (customizing flow behavior via impl.py hooks), and the symflow CLI (control
  plane). All packages below are first-party (author: SymOps, Inc. / Sym
  Engineering). The Sym product has been largely wound down and most source
  repos under github.com/symopsio are archived, but the published packages
  remain available.
